    <style>
        :root {

            --primary-hover: #357ABD;
            --success: #2ECC71;
            --error: #E74C3C;
            --warning: #F39C12;
            --purple: #9B59B6;
            --bg-color: #F0F4F8;
            --card-bg: #FFFFFF;
            --text-dark: #2C3E50;
            --text-gray: #7F8C8D;
            --border-radius: 16px;
        }

        * {

            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 850px;
        }

        .header h1 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-gray);
            font-size: 0.95rem;
        }

        .lesson-selector-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0;
            width: 100%;
            max-width: 850px;
            min-height: 40px;
        }

        .lesson-nav-btn {
            background: #E2E8F0;
            color: var(--text-dark);
            border: none;
            padding: 8px 14px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s;
        }

        .lesson-nav-btn:hover {
            background: #CBD5E1;
        }

        .lesson-nav-btn.active {
            background: var(--purple);
            color: white;
            box-shadow: 0 4px 10px rgba(155, 89, 182, 0.3);
        }

        .tab-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        .tab-btn {
            background: #E2E8F0;
            color: var(--text-dark);
            border: none;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }

        .main-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 800px;
            padding: 24px;
            position: relative;
            min-height: 400px;
        }

        .score-board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 12px;
            font-weight: bold;
            color: var(--text-dark);
        }

        .score-badge {
            background: #E8F8F0;
            color: #1E8449;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 1rem;
            border: 1px solid #A3E4D7;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: #E2E8F0;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .quiz-view {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .quiz-img-box {
            width: 100%;
            max-height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #FAFAFA;
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #E2E8F0;
            margin-bottom: 20px;
        }

        .quiz-img-box img {
            max-height: 250px;
            max-width: 100%;
            object-fit: contain;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .option-btn {
    background: #F8FAFC;
    border: 2px solid #E2E8F0;
    border-radius: 12px;
    padding: 14px 20px;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text-dark);
    cursor: pointer;
    text-align: left;
    display: flex;
    justify-content: space-between;
    align-items: center;
    white-space: pre-line;
}

        .opt-speaker {
            display: inline-block;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.85rem;
            margin-right: 6px;
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: #F0F7FF;
        }

        .option-btn.correct {
            background: #E8F8F0;
            border-color: var(--success);
            color: #1E8449;
        }

        .option-btn.wrong {
            background: #FADBD8;
            border-color: var(--error);
            color: #78281F;
        }

        .matching-view {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .match-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            width: 100%;
            margin-bottom: 20px;
        }

        .match-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .match-card {
            background: #F8FAFC;
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .match-card img {
            max-height: 50px;
            max-width: 100%;
            object-fit: contain;
        }

        .match-card.selected {
            border-color: var(--primary);
            background: #E3F2FD;
        }

        .match-card.matched {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .unscramble-view {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .unscramble-target-area {
            width: 100%;
            min-height: 80px;
            background: #F8FAFC;
            border: 2px dashed #CBD5E1;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 20px;
        }

        .unscramble-source-area {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            min-height: 60px;
        }

        .word-tile {
            background: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .word-tile.used {
            opacity: 0.3;
            cursor: default;
            pointer-events: none;
            border-color: #CBD5E1;
            color: #CBD5E1;
        }

        .unscramble-controls {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .action-btn {
            background: #E2E8F0;
            color: var(--text-dark);
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .action-btn.submit {
            background: var(--success);
            color: white;
        }

        .roleplay-view {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .big-img-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #E2E8F0;
            margin-bottom: 20px;
            background: #FAFAFA;
            text-align: center;
        }

        .big-img-container img {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
        }

        .dialogue-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .dialogue-item {
            background: #F8FAFC;
            border: 2px solid #E2E8F0;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .dialogue-speaker {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.9rem;
        }

        .dialogue-en {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 2px 0;
        }

        .dialogue-zh {
            font-size: 0.9rem;
            color: var(--text-gray);
        }

        .play-icon {
            width: 36px;
            height: 36px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .feedback-text {
            margin-top: 16px;
            font-weight: bold;
            font-size: 1.1rem;
            min-height: 28px;
            text-align: center;
        }

        .final-report {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4A90E2, #357ABD);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 15px 0;
        }

            margin-top: 16px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
        }

</head>

        <p>自由切換課文與練習模式，輕鬆掌握全部句型！</p>

        <button class="tab-btn" id="btn-unscramble">🧩 3. 句子重組</button>
        <button class="tab-btn" id="btn-roleplay">🎭 4. 角色點讀</button>
    </div>

    <div class="main-card">
        <div class="score-board-header" id="global-score-board">
            <span id="game-title-text">看圖選擇正確的句子</span>
            <span class="score-badge" id="current-score-badge">💯 當前分數: 100</span>
        </div>

        <div class="progress-bar-container" id="global-progress-container">
            <div class="progress-bar" id="global-progress-bar"></div>
        </div>

        <!-- 模式 1: 看圖選句 -->
        <div class="quiz-view" id="quiz-view">
            <div id="quiz-body" style="width: 100%;">
                <div class="quiz-img-box">
                    <img id="quiz-img" src="" alt="Quiz Scene" onerror="this.src='https://via.placeholder.com/350x250?text=Illustration'">
                </div>
                <div class="options-grid" id="options-grid"></div>
            </div>
        </div>

        <!-- 模式 2: 圖文連連看 -->
        <div class="matching-view" id="matching-view">
            <p style="text-align: center; color: var(--text-gray); margin-bottom: 15px; font-weight: bold;">點擊左側圖片/中文，再點擊右側對應英文完成匹配！</p>
            <div class="match-container">
                <div class="match-column" id="match-left-col"></div>
                <div class="match-column" id="match-right-col"></div>
            </div>
        </div>

        <!-- 模式 3: 句子重組 -->
        <div class="unscramble-view" id="unscramble-view">
            <div class="quiz-img-box">
                <img id="unscramble-img" src="" alt="Unscramble Scene" onerror="this.src='https://via.placeholder.com/350x250?text=Illustration'">
            </div>
            <p style="margin-bottom: 8px; font-weight: bold; color: var(--text-gray);">點擊詞塊拼出正確的句子：</p>
            <div class="unscramble-target-area" id="unscramble-target"></div>
            <div class="unscramble-source-area" id="unscramble-source"></div>
            <div class="unscramble-controls">
                <button class="action-btn" id="btn-reset-unscramble">↺ 清空重新拼</button>
                <button class="action-btn submit" id="btn-check-unscramble">✓ 確認提交</button>
            </div>
        </div>

        <!-- 模式 4: 角色點讀 -->
        <div class="roleplay-view" id="roleplay-view">
            <div class="big-img-container">
                <img id="roleplay-big-img" src="" alt="Full Illustration" onerror="this.src='https://via.placeholder.com/600x350?text=Full+Lesson+Image'">
            </div>
            <div class="dialogue-list" id="dialogue-list"></div>
        </div>

        <!-- 結算報告 -->
        <div class="final-report" id="final-report">

            <div class="score-circle">
                <span id="final-score" style="font-size:2.2rem; font-weight:bold;">100</span>

            </div>
            <div id="final-stars" style="font-size:2rem; margin:10px 0;">⭐⭐⭐</div>
            <p id="final-eval" style="font-weight: bold;"></p>
        </div>

        <div class="feedback-text" id="feedback"></div>
        <div style="text-align: center;">
            <button class="restart-btn" id="restart-btn" style="display: none;">🔄 重新本關挑戰</button>
        </div>
    </div>

        let currentLessonIndex = 0;

        let currentItemIndex = 0;
        let score = 100;
        let selectedLeftCard = null;
        let currentConstructedWords = [];

        let lessonNavBar, btnQuiz, btnMatch, btnUnscramble, btnRoleplay;
        let quizView, matchingView, unscrambleView, roleplayView, finalReport;
        let gameTitleText, currentScoreBadge, globalProgressBar, globalScoreBoard, globalProgressContainer, feedback, restartBtn;

        function speak(text) {
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US';
                    utterance.rate = 0.85;
                    window.speechSynthesis.speak(utterance);
                }
            } catch (e) {
                console.log("Audio speech not supported");
            }
        }

        function formatOptionText(text) {
            const speakers = sentenceSpeakers[text];
            const lines = text.split('\n');
            return lines.map((line, i) => {
                const spk = speakers ? speakers[i] : null;
                return spk ? `<span class="opt-speaker">${spk}</span>${line}` : line;
            }).join('<br>');
        }

        function initLessonNav() {
            lessonNavBar.innerHTML = '';
            allLessonsData.forEach((lesson, index) => {
                const btn = document.createElement('button');
                btn.className = `lesson-nav-btn ${index === currentLessonIndex ? 'active' : ''}`;
                btn.innerText = `第 ${lesson.lessonId} 課`;
                btn.onclick = () => {
                    currentLessonIndex = index;
                    document.querySelectorAll('.lesson-nav-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    resetGame();
                };
                lessonNavBar.appendChild(btn);
            });
        }

        function switchMode(mode) {
            currentMode = mode;
            [btnQuiz, btnMatch, btnUnscramble, btnRoleplay].forEach(btn => btn.classList.remove('active'));
            if (mode === 'quiz') btnQuiz.classList.add('active');
            if (mode === 'match') btnMatch.classList.add('active');
            if (mode === 'unscramble') btnUnscramble.classList.add('active');
            if (mode === 'roleplay') btnRoleplay.classList.add('active');

            resetGame();
        }

        function resetGame() {
            score = 100;
            currentItemIndex = 0;
            feedback.innerText = '';
            restartBtn.style.display = 'none';
            finalReport.style.display = 'none';

            globalScoreBoard.style.display = 'flex';
            globalProgressContainer.style.display = 'block';
            updateScoreUI();

            quizView.style.display = 'none';
            matchingView.style.display = 'none';
            unscrambleView.style.display = 'none';
            roleplayView.style.display = 'none';

            if (currentMode === 'quiz') {
                gameTitleText.innerText = '看圖選擇正確的句子';
                quizView.style.display = 'flex';
                loadQuizItem();
            } else if (currentMode === 'match') {
                gameTitleText.innerText = '圖文與英文配對連連看';
                matchingView.style.display = 'flex';
                loadMatchingGame();
            } else if (currentMode === 'unscramble') {
                gameTitleText.innerText = '看圖重組英文句子';
                unscrambleView.style.display = 'flex';
                loadUnscrambleItem();
            } else if (currentMode === 'roleplay') {
                gameTitleText.innerText = '角色扮演與點讀朗讀';
                globalScoreBoard.style.display = 'none';
                globalProgressContainer.style.display = 'none';
                roleplayView.style.display = 'flex';
                loadRoleplay();
            }
        }

        function updateScoreUI() {
            currentScoreBadge.innerText = `💯 當前分數: ${score}`;
        }

        function loadQuizItem() {
            const lesson = allLessonsData[currentLessonIndex];
            const item = lesson.items[currentItemIndex];
            const total = lesson.items.length;

            globalProgressBar.style.width = `${((currentItemIndex) / total) * 100}%`;
            gameTitleText.innerText = `【L${lesson.lessonId} 選句】第 ${currentItemIndex + 1} / ${total} 題`;

            document.getElementById('quiz-img').src = item.img;
            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';

            item.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span>${formatOptionText(opt)}</span><span style="font-size: 1.2rem;">🔊</span>`;
                btn.onclick = () => handleQuizOptionClick(idx, item.correctIndex, btn, item.text);
                optionsGrid.appendChild(btn);
            });
        }

        function handleQuizOptionClick(selectedIdx, correctIdx, btn, text) {
            speak(text);
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.style.pointerEvents = 'none');

            if (selectedIdx === correctIdx) {
                btn.classList.add('correct');
                feedback.style.color = 'var(--success)';
                feedback.innerText = '✓ 太棒了！回答正確！';
                setTimeout(() => {
                    currentItemIndex++;
                    feedback.innerText = '';
                    if (currentItemIndex < allLessonsData[currentLessonIndex].items.length) {
                        loadQuizItem();
                    } else {
                        showFinalReport();
                    }
                }, 1000);
            } else {
                btn.classList.add('wrong');
                allBtns[correctIdx].classList.add('correct');
                score = Math.max(0, score - 10);
                updateScoreUI();
                feedback.style.color = 'var(--error)';
                feedback.innerText = '❌ 答錯了，繼續加油！';
                setTimeout(() => {
                    currentItemIndex++;
                    feedback.innerText = '';
                    if (currentItemIndex < allLessonsData[currentLessonIndex].items.length) {
                        loadQuizItem();
                    } else {
                        showFinalReport();
                    }
                }, 1500);
            }
        }

        function loadMatchingGame() {
            const lesson = allLessonsData[currentLessonIndex];
            globalProgressBar.style.width = '50%';
            
            const leftCol = document.getElementById('match-left-col');
            const rightCol = document.getElementById('match-right-col');
            leftCol.innerHTML = '';
            rightCol.innerHTML = '';
            selectedLeftCard = null;

            let leftItems = lesson.items.map(item => ({ id: item.id, img: item.img, zh: item.zh }));
            let rightItems = lesson.items.map(item => ({ id: item.id, text: item.text }));

            leftItems.sort(() => Math.random() - 0.5);
            rightItems.sort(() => Math.random() - 0.5);

            leftItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.dataset.id = item.id;
                card.innerHTML = `<img src="${item.img}" alt="pic"><br><span style="font-size:0.85rem; color:var(--text-gray);">${item.zh}</span>`;
                card.onclick = () => {
                    document.querySelectorAll('#match-left-col .match-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedLeftCard = card;
                };
                leftCol.appendChild(card);
            });

            rightItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.dataset.id = item.id;
                card.innerText = item.text;
                card.onclick = () => {
                    if (!selectedLeftCard) {
                        feedback.style.color = 'var(--warning)';
                        feedback.innerText = '請先點擊左側的圖片！';
                        return;
                    }
                    speak(item.text);
                    if (selectedLeftCard.dataset.id === card.dataset.id) {
                        selectedLeftCard.classList.add('matched');
                        card.classList.add('matched');
                        selectedLeftCard = null;
                        feedback.style.color = 'var(--success)';
                        feedback.innerText = '✓ 匹配成功！';

                        const remaining = document.querySelectorAll('#match-left-col .match-card:not(.matched)');
                        if (remaining.length === 0) {
                            globalProgressBar.style.width = '100%';
                            setTimeout(() => showFinalReport(), 800);
                        }
                    } else {
                        score = Math.max(0, score - 10);
                        updateScoreUI();
                        feedback.style.color = 'var(--error)';
                        feedback.innerText = '❌ 匹配錯誤，再試一次！';
                        selectedLeftCard.classList.remove('selected');
                        selectedLeftCard = null;
                    }
                };
                rightCol.appendChild(card);
            });
        }

        function loadUnscrambleItem() {
            const lesson = allLessonsData[currentLessonIndex];
            const item = lesson.items[currentItemIndex];
            const total = lesson.items.length;

            globalProgressBar.style.width = `${((currentItemIndex) / total) * 100}%`;
            gameTitleText.innerText = `【L${lesson.lessonId} 重組】第 ${currentItemIndex + 1} / ${total} 題`;

            document.getElementById('unscramble-img').src = item.img;
            const targetArea = document.getElementById('unscramble-target');
            const sourceArea = document.getElementById('unscramble-source');

            targetArea.innerHTML = '';
            sourceArea.innerHTML = '';
            currentConstructedWords = [];

            let shuffledWords = [...item.words].sort(() => Math.random() - 0.5);

            shuffledWords.forEach((word, index) => {
                const tile = document.createElement('div');
                tile.className = 'word-tile';
                tile.innerText = word;

                tile.onclick = () => {
                    if (tile.classList.contains('used')) return;
                    tile.classList.add('used');

                    const targetTile = document.createElement('div');
                    targetTile.className = 'word-tile';
                    targetTile.innerText = word;
                    targetTile.onclick = () => {
                        targetArea.removeChild(targetTile);
                        tile.classList.remove('used');
                        currentConstructedWords = currentConstructedWords.filter(t => t !== targetTile);
                    };

                    targetArea.appendChild(targetTile);
                    currentConstructedWords.push(targetTile);
                };

                sourceArea.appendChild(tile);
            });
        }

        function loadRoleplay() {
            const lesson = allLessonsData[currentLessonIndex];
            document.getElementById('roleplay-big-img').src = lesson.bigImg;

            const dialogueList = document.getElementById('dialogue-list');
            dialogueList.innerHTML = '';

            lesson.roleplay.forEach((line) => {
                const item = document.createElement('div');
                item.className = 'dialogue-item';
                item.innerHTML = `
                    <div class="dialogue-info">
                        <span class="dialogue-speaker">${line.speaker}</span>
                        <span class="dialogue-en">${line.en}</span>
                        <span class="dialogue-zh">${line.zh}</span>
                    </div>
                    <div class="play-icon">🔊</div>
                `;

                item.onclick = () => {
                    speak(line.text);
                };

                dialogueList.appendChild(item);
            });
        }

        function showFinalReport() {
            quizView.style.display = 'none';
            matchingView.style.display = 'none';
            unscrambleView.style.display = 'none';
            roleplayView.style.display = 'none';

            globalScoreBoard.style.display = 'none';
            globalProgressContainer.style.display = 'none';

            finalReport.style.display = 'flex';
            document.getElementById('final-score').innerText = score;

            const starsBox = document.getElementById('final-stars');
            const evalText = document.getElementById('final-eval');

            if (score === 100) {
                starsBox.innerText = '⭐⭐⭐';
                evalText.innerText = '🏆 太棒了！完美通關，全對滿分！';
            } else if (score >= 80) {
                starsBox.innerText = '⭐⭐';
                evalText.innerText = '🌟 表現非常優秀！繼續保持！';
            } else {
                starsBox.innerText = '⭐';
                evalText.innerText = '💪 已經很棒了，再試一次拿到滿分吧！';
            }

            restartBtn.style.display = 'inline-block';
        }

        document.addEventListener('DOMContentLoaded', () => {
            lessonNavBar = document.getElementById('lesson-nav-bar');
            btnQuiz = document.getElementById('btn-quiz');
            btnMatch = document.getElementById('btn-match');
            btnUnscramble = document.getElementById('btn-unscramble');
            btnRoleplay = document.getElementById('btn-roleplay');

            quizView = document.getElementById('quiz-view');
            matchingView = document.getElementById('matching-view');
            unscrambleView = document.getElementById('unscramble-view');
            roleplayView = document.getElementById('roleplay-view');
            finalReport = document.getElementById('final-report');

            gameTitleText = document.getElementById('game-title-text');
            currentScoreBadge = document.getElementById('current-score-badge');
            globalProgressBar = document.getElementById('global-progress-bar');
            globalScoreBoard = document.getElementById('global-score-board');
            globalProgressContainer = document.getElementById('global-progress-container');
            feedback = document.getElementById('feedback');
            restartBtn = document.getElementById('restart-btn');

            btnQuiz.onclick = () => switchMode('quiz');
            btnMatch.onclick = () => switchMode('match');
            btnUnscramble.onclick = () => switchMode('unscramble');
            btnRoleplay.onclick = () => switchMode('roleplay');

            document.getElementById('btn-reset-unscramble').onclick = () => loadUnscrambleItem();
            document.getElementById('btn-check-unscramble').onclick = () => {
                const lesson = allLessonsData[currentLessonIndex];
                const item = lesson.items[currentItemIndex];
                const userSentence = currentConstructedWords.map(t => t.innerText).join(' ');
                const targetSentence = item.words.join(' ');

                speak(item.text);

                if (userSentence === targetSentence) {
                    feedback.style.color = 'var(--success)';
                    feedback.innerText = '✓ 拼寫完全正確！';
                    setTimeout(() => {
                        currentItemIndex++;
                        feedback.innerText = '';
                        if (currentItemIndex < lesson.items.length) {
                            loadUnscrambleItem();
                        } else {
                            showFinalReport();
                        }
                    }, 1000);
                } else {
                    score = Math.max(0, score - 10);
                    updateScoreUI();
                    feedback.style.color = 'var(--error)';
                    feedback.innerText = `❌ 順序有誤，正確為：${targetSentence}`;
                }
            };

            restartBtn.onclick = () => resetGame();

            initLessonNav();
            resetGame();
        });
    </script>
